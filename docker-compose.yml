name: agent

x-agent-common: &agent-common
  build:
    context: .
    dockerfile: Dockerfile
  image: agent-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  extra_hosts:
    - "host.docker.internal:host-gateway"   # alcança o Ollama que roda no host
  networks: [assist]

services:
  postgres:
    image: postgres:16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [assist]
    healthcheck:
      # CMD-SHELL: evita o bug de passar "-U assist -d assistdb" como UM argumento
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"   # só localhost: usado pelo host_runner
    volumes:
      - redisdata:/data
    networks: [assist]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-api:
    <<: *agent-common
    container_name: agent-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    group_add: ["4"]            # GID do grupo adm no host (confira: getent group adm)
    read_only: true             # filesystem do container imutável
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/log/agent:/logs:ro # pasta, somente leitura
    environment:
      AUTH_LOG_PATH: /logs/auth.log 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [assist]    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent-worker:
    <<: *agent-common
    container_name: agent-worker
    # -m worker.worker (módulo) => "app" fica importável; "python worker/worker.py" quebraria o import
    command: ["python", "-u", "-m", "worker.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.alive')<180 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3  
      
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-Admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?defina GF_SECURITY_ADMIN_PASSWORD no .env}
    volumes:
      - ./observability/grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [assist]
      start_period: 20s
      
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
#    ports:
#      - "9090:9090"
    networks: [assist]
      
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:  
      - agent-api
    networks: [assist]

  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml
      - ./observability/loki/data:/loki
    ports:
      - "3100:3100"
    networks: assist

  promtail:
    image: grafana/promtail:2.9.6
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml
      - /var/log:/var/log:ro
    depends_on: 
      - loki
    networks: [assist]
    
  node_exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    network_mode: "host"
    command:
      - --collector.systemd
      - --no-collector.hwmon
    
networks:
  assist:
    name: assist

volumes:
  pgdata:
  redisdata:
